[package]
name = "fs_walker"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
console-subscriber = "0.5.0"
futures = "0.3.34"
prost = "0.11.8"
protoc = "2.28.0"
tokio = {version = "1.27.0", features = ["full"]}
tokio-stream = "0.1.12"
tonic = {version = "0.9.1", features = ["transport", "tls"]}
walkdir = "2.3.3"

[build-dependencies]
tonic-build = "0.9.1"
